services:
  db:
    image: postgres:16
    container_name: stars_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stars
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: stars
      # Force md5 auth so PgBouncer can authenticate easily via userlist
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "5432:5432"
    volumes:
      - stars_pgdata:/var/lib/postgresql/data
    # Docker defaults /dev/shm to 64MB, which Postgres uses (POSIX shared memory) for parallel
    # query worker state. metric_failed_monitors is large enough that a bare "SELECT *" picks a
    # parallel scan plan, and many concurrent client connections (e.g. export_parquet.py's
    # partitioned reads) can spawn well over 100 parallel workers competing for that same 64MB,
    # exhausting it with "could not resize shared memory segment ... No space left on device".
    shm_size: "2gb"
    command:
      - "postgres"
      - "-c"
      - "max_connections=350"

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: stars_pgbouncer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "6432:6432"
    environment:
      # Target database (inside the compose network)
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stars
      DB_USER: stars
      DB_PASSWORD: stars

      # PgBouncer listener
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: "6432"

      # IMPORTANT: avoids needing MD5/SCRAM hashes in userlist;
      # works well inside a private docker network.
      AUTH_TYPE: plain

      # Pooling settings
      # DEFAULT_POOL_SIZE + RESERVE_POOL_SIZE must comfortably exceed the worst-case concurrent
      # client count: RunEvaluation.kt spawns one JVM worker process per CPU core, each holding its
      # own single-connection HikariPool, so N servers x cores-per-server workers can all reach for
      # a connection around the same time (their simulation phases tend to sync up since they start
      # together). At 4 servers x 48 cores = 192 possible concurrent workers, the previous
      # 150+30=180 ceiling was already short of that, and workers queuing past Hikari's 10s
      # connectionTimeout surfaced as "Connection is not available, request timed out" with
      # total=0/active=0 (the pool never got a connection at all, rather than all being busy).
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "220"
      RESERVE_POOL_SIZE: "40"
      # Was 5s: combined with Hikari's 10s connectionTimeout, a request that needed the reserve
      # pool had almost no margin left after paying this activation delay. Lowering it means the
      # reserve kicks in faster, leaving more of Hikari's budget for the actual wait.
      RESERVE_POOL_TIMEOUT: "2"
      SERVER_IDLE_TIMEOUT: "60"

      # Optional
      QUERY_WAIT_TIMEOUT: "120"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits

volumes:
  stars_pgdata:
